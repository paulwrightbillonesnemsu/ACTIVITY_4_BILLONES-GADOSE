name: flutter_lab_portfolio
description: "Multi-screen Flutter laboratory activity portfolio app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  connectivity_plus: ^6.1.4
  http: ^1.3.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  nearby_connections: ^4.3.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.6
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
